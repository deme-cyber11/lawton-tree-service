<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Add photos — Comanche Tree Experts</title>
<style>
/* Lives on the site's own domain on purpose: a customer-facing link must not be
   a workers.dev URL, which Gmail treats as spam. The page is static on GitHub
   Pages and talks to the lead API over CORS, so the customer never leaves
   comanchetreeexperts.com. Palette comes from the site's own stylesheets above. */
:root{ --up-accent:#0ea5e9; --up-accent-dark:#0284c7; }
body{margin:0;background:#f4f6f8;color:#15202b;
  font:17px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:28px 16px 56px}
.card{max-width:34rem;margin:0 auto;background:#fff;border:1px solid #e1e7ee;
  border-radius:16px;padding:26px 24px}
h1{margin:0;font-size:1.5rem;letter-spacing:-.02em}
p{margin:.6rem 0 0;color:#5c6775}
.job{margin-top:6px;font-weight:700;color:#15202b}
label.drop{margin-top:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:8px;min-height:170px;border:2px dashed var(--up-accent);border-radius:14px;
  background:color-mix(in srgb, var(--up-accent) 6%, #fff);cursor:pointer;text-align:center;padding:20px}
.drop b{font-size:1.06rem;color:#15202b}.drop span{color:#5c6775;font-size:.93rem}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
#list{margin-top:14px;font-size:.92rem;color:#5c6775}
button{margin-top:18px;width:100%;padding:16px;font-size:1.06rem;font-weight:700;color:#fff;
  background:var(--up-accent);border:0;border-radius:12px;cursor:pointer}
button:disabled{background:#b9c3cd;cursor:default}
button:active{background:var(--up-accent-dark)}
.msg{padding:14px 16px;border-radius:12px;font-weight:600;margin-bottom:4px}
.ok{background:#e9f7ef;border:1px solid #bde5cc;color:#15803d}
.bad{background:#fef2f2;border:1px solid #fecaca;color:#b91c1c}
footer{max-width:34rem;margin:18px auto 0;text-align:center;color:#8a95a3;font-size:.84rem}
footer a{color:inherit}
</style>
</head>
<body>
<div class="card" id="card">
  <div id="msg"></div>
  <h1>Add photos or a video</h1>
  <p id="hi">Loading…</p>
  <div class="job" id="job"></div>
  <form id="f">
    <label class="drop">
      <b>Tap to choose photos or video</b>
      <span>Or take one now. Up to 10 files.</span>
      <!-- Naming JPEG and PNG rather than image/* makes iOS convert HEIC on the
           way out, so Chrome and Firefox can display what arrives. -->
      <input id="files" type="file" name="files" multiple
             accept="image/jpeg,image/png,video/mp4,video/quicktime">
    </label>
    <div id="list"></div>
    <button id="go" type="submit" disabled>Send</button>
  </form>
</div>
<footer><a href="https://comanchetreeexperts.com">Comanche Tree Experts</a></footer>
<script>
(function () {
  var API = 'https://lead-manager-api.irontigerdigital.workers.dev';
  var tok = new URLSearchParams(location.search).get('t') || '';
  var f = document.getElementById('files'), go = document.getElementById('go'),
      list = document.getElementById('list'), msg = document.getElementById('msg');
  function say(cls, text) { msg.innerHTML = '<div class="msg ' + cls + '">' + text + '</div>'; }
  if (!/^[a-z2-9]{12}$/.test(tok)) { say('bad', 'This link is not valid.'); document.getElementById('f').hidden = true; return; }

  fetch(API + '/api/upload-brief/' + tok).then(function (r) { return r.json(); }).then(function (d) {
    if (d.error) { say('bad', 'This link has expired.'); document.getElementById('f').hidden = true; return; }
    document.getElementById('hi').textContent =
      'Hi ' + d.who + ', a few pictures help us quote the job accurately before coming out.';
    document.getElementById('job').textContent = d.job || '';
    if (d.accent) {
      document.documentElement.style.setProperty('--up-accent', d.accent);
      document.documentElement.style.setProperty('--up-accent-dark', d.accentDark || d.accent);
    }
  }).catch(function () { document.getElementById('hi').textContent =
      'A few pictures help us quote the job accurately before coming out.'; });

  f.addEventListener('change', function () {
    list.textContent = '';
    for (var i = 0; i < f.files.length; i++) {
      var d = document.createElement('div');
      d.textContent = f.files[i].name + '  (' + Math.round(f.files[i].size / 1048576 * 10) / 10 + ' MB)';
      list.appendChild(d);
    }
    go.disabled = !f.files.length;
    go.textContent = f.files.length ? 'Send ' + f.files.length + ' file' + (f.files.length > 1 ? 's' : '') : 'Send';
  });

  document.getElementById('f').addEventListener('submit', function (e) {
    e.preventDefault();
    go.disabled = true; go.textContent = 'Sending…';
    var fd = new FormData();
    for (var i = 0; i < f.files.length; i++) fd.append('files', f.files[i]);
    fetch(API + '/api/upload/' + tok, { method: 'POST', body: fd })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d.ok && d.added) {
          say('ok', 'Got ' + d.added + ' file' + (d.added > 1 ? 's' : '') + '. Thank you, that is all we need.');
          f.value = ''; list.textContent = ''; go.textContent = 'Send more'; go.disabled = true;
        } else { say('bad', 'Nothing came through. Please try again.'); go.disabled = false; go.textContent = 'Send'; }
      })
      .catch(function () { say('bad', 'Something went wrong. Please try again.'); go.disabled = false; go.textContent = 'Send'; });
  });
})();
</script>
<!-- itd-d24: page attribution for leads and calls, managed by tools/page-attribution-plan.py -->

</body>
</html>
